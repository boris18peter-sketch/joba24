workflows:
  ios-workflow:
    name: Joba24 iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Joba24
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.base69e6bdb4986a04a256653a23.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        CERTIFICATE_P12_PASSWORD: "Joba24SigningPass1"
        # FACEBOOK_CLIENT_TOKEN is provided by the ios_signing environment group
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor iOS project
        script: |
          ./node_modules/.bin/cap sync ios
      - name: Inject TikTok App Events SDK (iOS)
        script: |
          python3 << 'PYEOF'
          import os, re, json

          APP_ID = os.environ.get("TIKTOK_APP_ID", "").strip()
          TT_APP_ID = os.environ.get("TIKTOK_TT_APP_ID", "").strip()
          APP_SECRET = os.environ.get("TIKTOK_APP_SECRET", "").strip()

          # ── Fail safe: no credentials -> inject nothing at all ──
          # The TikTok native integration is credential-gated on purpose. With
          # no credentials the build is byte-identical to today's build, so a
          # missing credential can never break a release. TikTok simply reports
          # WAITING FOR CREDENTIAL at runtime.
          missing = [n for n, v in (("TIKTOK_APP_ID", APP_ID), ("TIKTOK_TT_APP_ID", TT_APP_ID), ("TIKTOK_APP_SECRET", APP_SECRET)) if not v]
          if missing:
              print("[tiktok] SKIPPED - missing: " + ", ".join(missing))
              print("[tiktok] iOS build continues without the TikTok SDK (no partial state).")
              raise SystemExit(0)

          PKG_DIR = "ios/App/CapApp-SPM/Sources/CapApp-SPM"
          PKG_SWIFT = "ios/App/CapApp-SPM/Package.swift"

          # ── 1. Add TikTokBusinessSDK to the SPM package (idempotent) ──
          with open(PKG_SWIFT, "r") as f:
              pkg = f.read()
          if "tiktok-business-ios-sdk" not in pkg:
              pkg = pkg.replace(
                  '.package(url: "https://github.com/facebook/facebook-ios-sdk.git", from: "17.0.0")',
                  '.package(url: "https://github.com/facebook/facebook-ios-sdk.git", from: "17.0.0"),\n        .package(url: "https://github.com/tiktok/tiktok-business-ios-sdk.git", from: "1.7.2")',
                  1)
              pkg = pkg.replace(
                  '.product(name: "FacebookCore", package: "facebook-ios-sdk")',
                  '.product(name: "FacebookCore", package: "facebook-ios-sdk"),\n                .product(name: "TikTokBusinessSDK", package: "tiktok-business-ios-sdk")',
                  1)
              with open(PKG_SWIFT, "w") as f:
                  f.write(pkg)
              print("[tiktok] Added TikTokBusinessSDK to Package.swift")
          else:
              print("[tiktok] TikTokBusinessSDK already in Package.swift")

          # ── 2. Write the native plugin ──
          plugin = '''import Foundation
          import Capacitor
          import TikTokBusinessSDK

          // TikTok App Events bridge. Registered in JobaBridgeViewController.capacitorDidLoad().
          //
          // SKAdNetwork: Meta is the single conversion-value writer in this app, so
          // TikTok's own SKAN updates are disabled (disableSKAdNetworkSupport()).
          // TikTok attribution is still configured through TikTok Events Manager.
          @objc(TikTokAppEventsPlugin)
          public class TikTokAppEventsPlugin: CAPPlugin, CAPBridgedPlugin {
              public let identifier = "TikTokAppEventsPlugin"
              public let jsName = "TikTokAppEvents"
              public let pluginMethods: [CAPPluginMethod] = [
                  CAPPluginMethod(name: "logEvent", returnType: CAPPluginReturnPromise),
                  CAPPluginMethod(name: "setUserId", returnType: CAPPluginReturnPromise),
                  CAPPluginMethod(name: "logout", returnType: CAPPluginReturnPromise),
                  CAPPluginMethod(name: "isAvailable", returnType: CAPPluginReturnPromise)
              ]

              private var initialized = false

              override public func load() {
                  let appId = Bundle.main.object(forInfoDictionaryKey: "TikTokAppId") as? String ?? ""
                  let ttAppId = Bundle.main.object(forInfoDictionaryKey: "TikTokTTAppId") as? String ?? ""
                  let appSecret = Bundle.main.object(forInfoDictionaryKey: "TikTokAppSecret") as? String ?? ""

                  guard !appId.isEmpty, !ttAppId.isEmpty, !appSecret.isEmpty else {
                      print("[TikTok] credentials missing - SDK not initialised")
                      return
                  }

                  // TikTokConfig exposes a class factory method, NOT an initializer.
                  guard let config = TikTokConfig.config(withAccessToken: appSecret, appId: appId, tiktokAppId: ttAppId) else {
                      print("[TikTok] config could not be created")
                      return
                  }

                  // Meta remains the single SKAdNetwork conversion-value writer.
                  config.disableSKAdNetworkSupport()

                  // NOTE: initializeSdk returns Void on iOS (unlike Android's void-with-state),
                  // so success is confirmed via isInitialized() instead of an if-condition.
                  TikTokBusiness.initializeSdk(config)
                  initialized = TikTokBusiness.isInitialized()
                  print("[TikTok] SDK initialised: \(initialized)")
              }

              @objc public func logEvent(_ call: CAPPluginCall) {
                  guard initialized else { call.resolve(); return }
                  guard let eventName = call.getString("name") else {
                      call.reject("name is required")
                      return
                  }
                  let props = call.getObject("params") ?? [:]
                  let eventId = call.getString("eventId")
                  // TikTokBaseEvent takes an NSDictionary, not a JSON string.
                  var eventProps: [AnyHashable: Any] = [:]
                  for (key, value) in props { eventProps[key] = value }
                  let event = TikTokBaseEvent(eventName: eventName, properties: eventProps, eventId: eventId)
                  TikTokBusiness.trackTTEvent(event)
                  call.resolve()
              }

              @objc public func setUserId(_ call: CAPPluginCall) {
                  let userId = call.getString("userId") ?? ""
                  if !userId.isEmpty {
                      TikTokBusiness.identify(withExternalID: userId, externalUserName: nil, phoneNumber: nil, email: nil)
                  }
                  call.resolve()
              }

              @objc public func logout(_ call: CAPPluginCall) {
                  TikTokBusiness.logout()
                  call.resolve()
              }

              @objc public func isAvailable(_ call: CAPPluginCall) {
                  call.resolve(["available": initialized])
              }
          }
          '''
          # Strip the python-heredoc indentation so the Swift file is well formed
          plugin = "\n".join(line[10:] if line.startswith("          ") else line for line in plugin.split("\n"))
          with open(os.path.join(PKG_DIR, "TikTokAppEventsPlugin.swift"), "w") as f:
              f.write(plugin + "\n")
          print("[tiktok] Wrote TikTokAppEventsPlugin.swift")

          # ── 3. Register the plugin in SceneDelegate ──
          scene = "ios/App/App/SceneDelegate.swift"
          with open(scene, "r") as f:
              sc = f.read()
          if "TikTokAppEventsPlugin" not in sc:
              sc = sc.replace(
                  "bridge?.registerPluginInstance(MetaAppEventsPlugin())",
                  "bridge?.registerPluginInstance(MetaAppEventsPlugin())\n        bridge?.registerPluginInstance(TikTokAppEventsPlugin())",
                  1)
              with open(scene, "w") as f:
                  f.write(sc)
              print("[tiktok] Registered TikTokAppEventsPlugin in SceneDelegate.swift")
          else:
              print("[tiktok] TikTokAppEventsPlugin already registered")

          # ── 4. Inject credentials into Info.plist ──
          plist = "ios/App/App/Info.plist"
          import plistlib
          with open(plist, "rb") as f:
              info = plistlib.load(f)
          info["TikTokAppId"] = APP_ID
          info["TikTokTTAppId"] = TT_APP_ID
          info["TikTokAppSecret"] = APP_SECRET
          with open(plist, "wb") as f:
              plistlib.dump(info, f)
          print("[tiktok] Injected TikTok credentials into Info.plist (values not printed)")
          PYEOF
      - name: Validate Xcode project file syntax
        script: |
          ruby -e 'require "xcodeproj"; Xcodeproj::Project.open("ios/App/App.xcodeproj")' && echo "project.pbxproj is valid" || (echo "ERROR: project.pbxproj has a syntax error - it was likely corrupted during copy-paste. Re-copy the full file carefully." && exit 1)
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --p12-password "$CERTIFICATE_P12_PASSWORD" \
            --certificates-dir "$HOME/Library/MobileDevice/Certificates" \
            --profiles-dir "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Set up signing certificate
        script: |
          keychain add-certificates \
            --certificate "$HOME/Library/MobileDevice/Certificates/*.p12" \
            --certificate-password "$CERTIFICATE_P12_PASSWORD"
      - name: Verify certificate is in keychain
        script: |
          security find-identity -v -p codesigning
      - name: List downloaded provisioning profiles
        script: |
          echo "Contents of profiles directory:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "Directory does not exist or is empty"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --verbose
      - name: Verify FACEBOOK_CLIENT_TOKEN is available (iOS)
        script: |
          if [ -z "${FACEBOOK_CLIENT_TOKEN:-}" ]; then
            echo "ERROR: FACEBOOK_CLIENT_TOKEN is empty or not set."
            echo "The Meta App Events SDK cannot be configured without it, so app events would silently fail."
            echo "Set it in the 'ios_signing' environment group (Codemagic > Environment variables)."
            exit 1
          fi
          echo "FACEBOOK_CLIENT_TOKEN is present (value intentionally not printed)."
      - name: Archive the app
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=322DV2PB9V \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION=2.130298.0 \
            CURRENT_PROJECT_VERSION=19 \
            FACEBOOK_CLIENT_TOKEN="$FACEBOOK_CLIENT_TOKEN"
      - name: Verify SKAdNetwork IDs in the built app (iOS)
        script: |
          PLIST="$CM_BUILD_DIR/build/App.xcarchive/Products/Applications/App.app/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "ERROR: archived Info.plist not found at $PLIST - cannot verify SKAdNetwork configuration."
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :SKAdNetworkItems" "$PLIST" > /dev/null 2>&1; then
            echo "ERROR: SKAdNetworkItems is missing from the archived production build."
            exit 1
          fi
          COUNT=$(/usr/libexec/PlistBuddy -c "Print :SKAdNetworkItems" "$PLIST" | grep -c "SKAdNetworkIdentifier" || true)
          echo "SKAdNetworkItems present in the production build ($COUNT entries)."
          for ID in v9wttpbfk9.skadnetwork n38lu8286q.skadnetwork; do
            if /usr/libexec/PlistBuddy -c "Print :SKAdNetworkItems" "$PLIST" | grep -q "$ID"; then
              echo "  OK: $ID"
            else
              echo "ERROR: required Meta SKAdNetwork ID $ID is missing from the archived build."
              exit 1
            fi
          done
      - name: Verify Firebase Analytics + TikTok SDK in the archived build
        script: |
          APP="$CM_BUILD_DIR/build/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: archived .app not found at $APP"
            exit 1
          fi

          echo "=== Firebase Analytics (native SDK linked) ==="
          if find "$APP" -name "*FirebaseAnalytics*" | head -1 | grep -q .; then
            echo "OK: FirebaseAnalytics framework present in the archived app"
          else
            echo "ERROR: FirebaseAnalytics is missing from the archived app - Google Ads conversions will not be recorded."
            exit 1
          fi
          if [ -f "$APP/GoogleService-Info.plist" ]; then
            echo "OK: GoogleService-Info.plist bundled"
          else
            echo "ERROR: GoogleService-Info.plist is not bundled - Firebase Analytics cannot initialise."
            exit 1
          fi

          echo ""
          echo "=== TikTok App Events SDK (credential-gated) ==="
          if [ -n "${TIKTOK_APP_ID:-}" ] && [ -n "${TIKTOK_APP_SECRET:-}" ]; then
            if find "$APP" -name "*TikTokBusinessSDK*" | head -1 | grep -q .; then
              echo "OK: TikTokBusinessSDK framework present in the archived app"
            else
              echo "ERROR: TikTok credentials were provided but TikTokBusinessSDK is missing from the archived app."
              exit 1
            fi
            if /usr/libexec/PlistBuddy -c "Print :TikTokAppSecret" "$APP/Info.plist" > /dev/null 2>&1; then
              echo "OK: TikTok credentials present in Info.plist (values not printed)"
            else
              echo "ERROR: TikTokAppSecret missing from Info.plist."
              exit 1
            fi
          else
            echo "SKIPPED: TikTok credentials not provided - TikTok is WAITING FOR CREDENTIAL."
          fi
      - name: Export ipa
        script: |
          PROFILE_PATH=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -n 1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No .mobileprovision file found in Provisioning Profiles directory"
            exit 1
          fi
          echo "Profile file: $PROFILE_PATH"
          echo "File details:"
          ls -la "$PROFILE_PATH"
          file "$PROFILE_PATH"
          echo "--- Extracting profile name ---"
          security cms -D -i "$PROFILE_PATH" -o /tmp/profile.plist
          echo "Decoded plist contents saved. First 500 chars:"
          head -c 500 /tmp/profile.plist
          echo ""
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: Could not extract profile name from decoded plist"
            exit 1
          fi
          echo "Using provisioning profile: $PROFILE_NAME"
          cat > "$CM_BUILD_DIR/export_options.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>322DV2PB9V</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Joba24 Android Workflow
    max_build_duration: 60
    environment:
      android_signing:
        - joba24_android_upload
      groups:
        - ios_signing          # shares FACEBOOK_CLIENT_TOKEN with iOS; does not affect keystore signing
      vars:
        ANDROID_VERSION_CODE: 19
        ANDROID_VERSION_NAME: "1.0.1"
        VITE_BASE44_APP_ID: "69e6bdb4986a04a256653a23"
        VITE_BASE44_APP_BASE_URL: "https://joba24.base44.app"
        # FACEBOOK_CLIENT_TOKEN is provided by the ios_signing environment group
      node: latest
      java: 21
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Verify Base44 config was injected into build
        script: |
          if grep -r "69e6bdb4986a04a256653a23" dist/ > /dev/null 2>&1; then
            echo "App ID found in build output - good"
          else
            echo "ERROR: App ID not found in dist/ - VITE_BASE44_APP_ID may not have been injected correctly"
            exit 1
          fi
          if grep -r "joba24.base44.app" dist/ > /dev/null 2>&1; then
            echo "App base URL found in build output - good"
          else
            echo "ERROR: joba24.base44.app not found in dist/ - VITE_BASE44_APP_BASE_URL may not have been injected correctly"
            exit 1
          fi
      - name: Remove remote server URL for local Android build
        script: |
          python3 << 'PYEOF'
          import json

          with open("capacitor.config.json", "r") as f:
              config = json.load(f)

          if "server" in config:
              del config["server"]

          with open("capacitor.config.json", "w") as f:
              json.dump(config, f, indent=2)

          print("Updated capacitor.config.json for local Android build:")
          print(json.dumps(config, indent=2))
          PYEOF
      - name: Add Android platform
        script: |
          npx cap add android
      - name: Inject Meta App Events SDK for Android
        script: |
          python3 << 'PYEOF'
          import os

          # Fail fast if the Meta client token is missing. Without it the SDK
          # loads but app events are never delivered — a silent failure that is
          # very hard to notice after release. The value is never printed.
          FB_CLIENT_TOKEN = os.environ.get("FACEBOOK_CLIENT_TOKEN", "").strip()
          if not FB_CLIENT_TOKEN:
              raise SystemExit(
                  "ERROR: FACEBOOK_CLIENT_TOKEN is empty or not set. "
                  "Set it in the 'ios_signing' environment group (Codemagic > Environment variables). "
                  "The Meta App Events SDK cannot be configured without it."
              )
          print("[meta] FACEBOOK_CLIENT_TOKEN is present (value intentionally not printed)")

          PKG = "com.base69e6bdb4986a04a256653a23.app"
          PKG_PATH = PKG.replace(".", "/")
          SRC_DIR = f"android/app/src/main/java/{PKG_PATH}"
          META_APP_ID = "953835113913539"

          os.makedirs(SRC_DIR, exist_ok=True)

          # ── 1. Create MetaAppEventsPlugin.java ──
          plugin_code = f'''package {PKG};

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.facebook.appevents.AppEventsLogger;
          import android.os.Bundle;

          @CapacitorPlugin(name = "MetaAppEvents")
          public class MetaAppEventsPlugin extends Plugin {{
              private AppEventsLogger logger;

              @Override
              public void load() {{
                  super.load();
                  logger = AppEventsLogger.newLogger(getContext());
              }}

              @PluginMethod
              public void logEvent(PluginCall call) {{
                  String name = call.getString("name");
                  if (name == null) {{
                      call.reject("name is required");
                      return;
                  }}
                  JSObject params = call.getObject("params", new JSObject());
                  Bundle bundle = new Bundle();
                  // JSObject.keys() returns Iterator<String> (org.json.JSONObject),
                  // which is not Iterable - a for-each loop does not compile against it.
                  java.util.Iterator<String> keys = params.keys();
                  while (keys.hasNext()) {{
                      String key = keys.next();
                      Object value = params.get(key);
                      if (value instanceof String) {{
                          bundle.putString(key, (String) value);
                      }} else if (value instanceof Number) {{
                          bundle.putDouble(key, ((Number) value).doubleValue());
                      }} else if (value instanceof Boolean) {{
                          bundle.putBoolean(key, (Boolean) value);
                      }}
                  }}
                  Double valueToSum = call.getDouble("valueToSum", 0.0);
                  if (valueToSum != null && valueToSum > 0) {{
                      logger.logEvent(name, valueToSum, bundle);
                  }} else {{
                      logger.logEvent(name, bundle);
                  }}
                  call.resolve();
              }}

              @PluginMethod
              public void setUserId(PluginCall call) {{
                  String userId = call.getString("userId", "");
                  logger.setUserID(userId.isEmpty() ? null : userId);
                  call.resolve();
              }}
          }}
          '''
          plugin_path = os.path.join(SRC_DIR, "MetaAppEventsPlugin.java")
          with open(plugin_path, "w") as f:
              f.write(plugin_code)
          print(f"[meta] Created {plugin_path}")

          # ── 2. Register plugin + activate app events in MainActivity.java ──
          # The Capacitor template generates an EMPTY MainActivity with no
          # onCreate override, so the old "replace super.onCreate(...)" approach
          # matched nothing and silently registered nothing. The shared script
          # detects the real file, generates the override, and is idempotent.
          import subprocess
          subprocess.run([
              "python3", "scripts/patch-android-mainactivity.py",
              os.path.join(SRC_DIR, "MainActivity.java"),
              "--before", "registerPlugin(MetaAppEventsPlugin.class);",
              "--after", "com.facebook.appevents.AppEventsLogger.activateApp(getApplication());",
          ], check=True)
          print("[meta] Registered MetaAppEventsPlugin in MainActivity.java")

          # ── 3. Add Facebook SDK to app/build.gradle ──
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              gradle_content = f.read()

          if "facebook-android-sdk" not in gradle_content:
              gradle_content = gradle_content.replace(
                  "dependencies {",
                  "dependencies {\n    implementation 'com.facebook.android:facebook-android-sdk:17.0.0'",
                  1
              )
              with open(gradle_path, "w") as f:
                  f.write(gradle_content)
              print("[meta] Added Facebook SDK to app/build.gradle")
          else:
              print("[meta] Facebook SDK already in app/build.gradle")

          # ── 4. Add Facebook metadata to AndroidManifest.xml ──
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest_content = f.read()

          if "com.facebook.sdk.ApplicationId" not in manifest_content:
              meta_block = f'''        <meta-data android:name="com.facebook.sdk.ApplicationId" android:value="@string/facebook_app_id"/>
                  <meta-data android:name="com.facebook.sdk.ClientToken" android:value="@string/facebook_client_token"/>
                  <meta-data android:name="com.facebook.sdk.AutoLogAppEventsEnabled" android:value="true"/>
                  <meta-data android:name="com.facebook.sdk.AdvertiserIDCollectionEnabled" android:value="true"/>
          '''
              manifest_content = manifest_content.replace(
                  "<application",
                  meta_block + "        <application",
                  1
              )
              print("[meta] Added Facebook metadata to AndroidManifest.xml")
          else:
              print("[meta] Facebook metadata already in AndroidManifest.xml")

          # ── 4b. Advertising ID permission ──
          # Required for the Meta SDK to read the Android Advertising ID on
          # targetSdk 33+ (Android 13 and up). Without it the SDK silently loses
          # the identifier used for install attribution.
          if "com.google.android.gms.permission.AD_ID" not in manifest_content:
              manifest_content = manifest_content.replace(
                  "<application",
                  '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n        <application',
                  1
              )
              print("[meta] Added AD_ID permission to AndroidManifest.xml")
          else:
              print("[meta] AD_ID permission already in AndroidManifest.xml")

          # Single write, after every manifest edit above
          with open(manifest_path, "w") as f:
              f.write(manifest_content)

          # ── 5. Add Facebook strings to strings.xml ──
          strings_path = "android/app/src/main/res/values/strings.xml"
          fb_client_token = FB_CLIENT_TOKEN

          strings_content = ""
          if os.path.exists(strings_path):
              with open(strings_path, "r") as f:
                  strings_content = f.read()

          if "facebook_app_id" not in strings_content:
              fb_strings = f'''<string name="facebook_app_id">{META_APP_ID}</string>
          <string name="facebook_client_token">{fb_client_token}</string>
          '''
              strings_content = strings_content.replace(
                  "</resources>",
                  fb_strings + "</resources>",
                  1
              )
              with open(strings_path, "w") as f:
                  f.write(strings_content)
              print("[meta] Added Facebook strings to strings.xml")
          else:
              print("[meta] Facebook strings already in strings.xml")

          print("[meta] Meta App Events SDK injection complete")
          PYEOF
      - name: Inject TikTok App Events SDK (Android)
        script: |
          python3 << 'PYEOF'
          import os

          APP_ID = os.environ.get("TIKTOK_APP_ID", "").strip()
          TT_APP_ID = os.environ.get("TIKTOK_TT_APP_ID", "").strip()
          APP_SECRET = os.environ.get("TIKTOK_APP_SECRET", "").strip()

          # Fail safe: no credentials -> inject nothing at all. Credential-gated
          # on purpose: without credentials the build is byte-identical to
          # today's, so a missing credential can never break a release. TikTok
          # reports WAITING FOR CREDENTIAL at runtime instead.
          missing = [n for n, v in (("TIKTOK_APP_ID", APP_ID), ("TIKTOK_TT_APP_ID", TT_APP_ID), ("TIKTOK_APP_SECRET", APP_SECRET)) if not v]
          if missing:
              print("[tiktok] SKIPPED - missing: " + ", ".join(missing))
              print("[tiktok] Android build continues without the TikTok SDK (no partial state).")
              raise SystemExit(0)

          PKG = "com.base69e6bdb4986a04a256653a23.app"
          PKG_PATH = PKG.replace(".", "/")
          SRC_DIR = "android/app/src/main/java/" + PKG_PATH

          # 1a. Add the JitPack repository.
          # The TikTok App Events Android SDK is NOT published to Google Maven or
          # Maven Central - it is distributed via JitPack under the coordinate
          # com.github.tiktok:tiktok-business-android-sdk. Confirmed against the
          # official repo's own build.gradle (which declares
          # maven { url 'https://jitpack.io' }) and the JitPack POM for tag 1.7.1.
          # Without this repository Gradle cannot resolve the dependency.
          root_gradle_path = "android/build.gradle"
          with open(root_gradle_path, "r") as f:
              root_gradle = f.read()
          if "jitpack.io" not in root_gradle:
              anchor = "allprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}"
              if anchor not in root_gradle:
                  raise SystemExit("ERROR: the allprojects repositories block was not found in android/build.gradle - the Capacitor template changed, review this step.")
              root_gradle = root_gradle.replace(
                  anchor,
                  "allprojects {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url 'https://jitpack.io' }\n    }\n}",
                  1)
              with open(root_gradle_path, "w") as f:
                  f.write(root_gradle)
              print("[tiktok] Added JitPack repository to android/build.gradle")
          else:
              print("[tiktok] JitPack repository already present in android/build.gradle")

          # 1b. Add the TikTok SDK to app/build.gradle
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              gradle = f.read()
          if "tiktok-business-android-sdk" not in gradle:
              gradle = gradle.replace(
                  "dependencies {",
                  "dependencies {\n    implementation 'com.github.tiktok:tiktok-business-android-sdk:1.7.1'",
                  1)
              with open(gradle_path, "w") as f:
                  f.write(gradle)
              print("[tiktok] Added TikTok SDK to app/build.gradle")
          else:
              print("[tiktok] TikTok SDK already in app/build.gradle")

          # 2. Create TikTokAppEventsPlugin.java
          plugin = '''package %PKG%;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.tiktok.TikTokBusinessSdk;
          import com.tiktok.appevents.base.TTBaseEvent;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "TikTokAppEvents")
          public class TikTokAppEventsPlugin extends Plugin {
              private boolean initialized = false;

              @Override
              public void load() {
                  super.load();
                  try {
                      String appId = getContext().getString(R.string.tiktok_app_id);
                      String ttAppId = getContext().getString(R.string.tiktok_tt_app_id);
                      String appSecret = getContext().getString(R.string.tiktok_app_secret);
                      if (appId == null || appId.isEmpty()
                              || ttAppId == null || ttAppId.isEmpty()
                              || appSecret == null || appSecret.isEmpty()) {
                          android.util.Log.w("TikTok", "credentials missing - SDK not initialised");
                          return;
                      }
                      // TTConfig has no setAccessToken() in the official SDK.
                      // The access token is passed via this constructor overload.
                      TikTokBusinessSdk.TTConfig config =
                              new TikTokBusinessSdk.TTConfig(getContext(), appSecret)
                                      .setAppId(appId)
                                      .setTTAppId(ttAppId);
                      TikTokBusinessSdk.initializeSdk(config);
                      TikTokBusinessSdk.startTrack();
                      initialized = true;
                      android.util.Log.i("TikTok", "SDK initialised");
                  } catch (Throwable t) {
                      android.util.Log.e("TikTok", "initialisation failed: " + t.getMessage());
                  }
              }

              @PluginMethod
              public void logEvent(PluginCall call) {
                  if (!initialized) { call.resolve(); return; }
                  String name = call.getString("name");
                  if (name == null) { call.reject("name is required"); return; }
                  JSObject params = call.getObject("params", new JSObject());
                  JSONObject json = new JSONObject();
                  // JSObject.keys() returns Iterator<String> (org.json.JSONObject),
                  // which is not Iterable - a for-each loop does not compile against it.
                  java.util.Iterator<String> keys = params.keys();
                  while (keys.hasNext()) {
                      String key = keys.next();
                      try { json.put(key, params.get(key)); } catch (Throwable ignored) {}
                  }
                  String eventId = call.getString("eventId");
                  TikTokBusinessSdk.trackTTEvent(new TTBaseEvent(name, json, eventId));
                  call.resolve();
              }

              @PluginMethod
              public void setUserId(PluginCall call) {
                  String userId = call.getString("userId", "");
                  if (userId != null && !userId.isEmpty()) {
                      // The official SDK exposes identify(), not setUserID().
                      TikTokBusinessSdk.identify(userId, null, null, null);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void logout(PluginCall call) {
                  call.resolve();
              }

              @PluginMethod
              public void isAvailable(PluginCall call) {
                  JSObject res = new JSObject();
                  res.put("available", initialized);
                  call.resolve(res);
              }
          }
          '''
          plugin = plugin.replace("%PKG%", PKG)
          plugin = "\n".join(line[10:] if line.startswith("          ") else line for line in plugin.split("\n"))
          with open(os.path.join(SRC_DIR, "TikTokAppEventsPlugin.java"), "w") as f:
              f.write(plugin + "\n")
          print("[tiktok] Wrote TikTokAppEventsPlugin.java")

          # 3. Register the plugin in MainActivity.java
          # Same shared script as the Meta step: it detects the real generated
          # MainActivity, generates the missing onCreate override, and merges
          # idempotently so repeated builds never duplicate registrations.
          import subprocess
          subprocess.run([
              "python3", "scripts/patch-android-mainactivity.py",
              os.path.join(SRC_DIR, "MainActivity.java"),
              "--before", "registerPlugin(TikTokAppEventsPlugin.class);",
          ], check=True)
          print("[tiktok] Registered TikTokAppEventsPlugin in MainActivity.java")

          # 4. Add credentials to strings.xml
          strings_path = "android/app/src/main/res/values/strings.xml"
          with open(strings_path, "r") as f:
              strings = f.read()
          if "tiktok_app_id" not in strings:
              block = ('<string name="tiktok_app_id">' + APP_ID + '</string>\n'
                       '<string name="tiktok_tt_app_id">' + TT_APP_ID + '</string>\n'
                       '<string name="tiktok_app_secret">' + APP_SECRET + '</string>\n')
              strings = strings.replace("</resources>", block + "</resources>", 1)
              with open(strings_path, "w") as f:
                  f.write(strings)
              print("[tiktok] Added TikTok credentials to strings.xml (values not printed)")
          else:
              print("[tiktok] TikTok credentials already in strings.xml")

          # 5. Add the TikTok App ID meta-data to AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()
          if "com.tiktok.sdk.AppId" not in manifest:
              manifest = manifest.replace(
                  "<application",
                  '<meta-data android:name="com.tiktok.sdk.AppId" android:value="@string/tiktok_app_id"/>\n        <application',
                  1)
              with open(manifest_path, "w") as f:
                  f.write(manifest)
              print("[tiktok] Added TikTok App ID meta-data to AndroidManifest.xml")
          else:
              print("[tiktok] TikTok App ID meta-data already present")

          print("[tiktok] TikTok App Events SDK injection complete")
          PYEOF
      - name: Verify TikTok App Events SDK injection (Android)
        script: |
          if [ -z "${TIKTOK_APP_ID:-}" ] || [ -z "${TIKTOK_APP_SECRET:-}" ]; then
            echo "SKIPPED: TikTok credentials not provided - TikTok is WAITING FOR CREDENTIAL."
            exit 0
          fi
          BASE="android/app/src/main/java/com/base69e6bdb4986a04a256653a23/app"
          if [ -f "$BASE/TikTokAppEventsPlugin.java" ]; then
            echo "OK: TikTokAppEventsPlugin.java created"
          else
            echo "ERROR: TikTokAppEventsPlugin.java not found!"
            exit 1
          fi
          if grep -q "com.github.tiktok:tiktok-business-android-sdk" android/app/build.gradle; then
            echo "OK: TikTok SDK dependency present in build.gradle (JitPack coordinate)"
          else
            echo "ERROR: TikTok SDK not in build.gradle with the JitPack coordinate com.github.tiktok:tiktok-business-android-sdk"
            exit 1
          fi
          if grep -q "jitpack.io" android/build.gradle; then
            echo "OK: JitPack repository present in android/build.gradle"
          else
            echo "ERROR: JitPack repository missing from android/build.gradle - the TikTok SDK cannot resolve without it"
            exit 1
          fi
          MA="$BASE/MainActivity.java"
          if [ ! -f "$MA" ]; then
            echo "ERROR: MainActivity.java not found at $MA"
            exit 1
          fi
          # Verify the registration method Capacitor 8 actually requires, not just
          # that the class name appears somewhere in the file. registerPlugin()
          # only feeds the Bridge.Builder that BridgeActivity.onCreate() consumes
          # via load(), so the call must exist AND precede super.onCreate().
          REG_LINE=$(grep -n "registerPlugin(TikTokAppEventsPlugin.class);" "$MA" | head -1 | cut -d: -f1)
          SUPER_LINE=$(grep -n "super\.onCreate(" "$MA" | head -1 | cut -d: -f1)
          if [ -z "$REG_LINE" ]; then
            echo "ERROR: MainActivity never calls registerPlugin(TikTokAppEventsPlugin.class)"
            cat "$MA"
            exit 1
          fi
          if [ -z "$SUPER_LINE" ]; then
            echo "ERROR: MainActivity has no super.onCreate() call - registration order cannot be confirmed"
            cat "$MA"
            exit 1
          fi
          if [ "$REG_LINE" -ge "$SUPER_LINE" ]; then
            echo "ERROR: registerPlugin(TikTokAppEventsPlugin.class) at line $REG_LINE must come BEFORE super.onCreate() at line $SUPER_LINE"
            cat "$MA"
            exit 1
          fi
          echo "OK: TikTokAppEventsPlugin registered before super.onCreate (line $REG_LINE < $SUPER_LINE)"
          if grep -qE 'name="tiktok_app_secret">[^<]' android/app/src/main/res/values/strings.xml; then
            echo "OK: tiktok_app_secret is present and non-empty (value not printed)"
          else
            echo "ERROR: tiktok_app_secret missing or empty in strings.xml"
            exit 1
          fi
          if grep -q "com.tiktok.sdk.AppId" android/app/src/main/AndroidManifest.xml; then
            echo "OK: TikTok App ID meta-data present in manifest"
          else
            echo "ERROR: TikTok App ID meta-data missing from manifest"
            exit 1
          fi
