workflows:
  ios-workflow:
    name: Joba24 iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Joba24
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.base69e6bdb4986a04a256653a23.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        CERTIFICATE_P12_PASSWORD: "Joba24SigningPass1"
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor iOS project
        script: |
          ./node_modules/.bin/cap sync ios
      - name: Validate Xcode project file syntax
        script: |
          ruby -e 'require "xcodeproj"; Xcodeproj::Project.open("ios/App/App.xcodeproj")' && echo "project.pbxproj is valid" || (echo "ERROR: project.pbxproj has a syntax error - it was likely corrupted during copy-paste. Re-copy the full file carefully." && exit 1)
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --p12-password "$CERTIFICATE_P12_PASSWORD" \
            --certificates-dir "$HOME/Library/MobileDevice/Certificates" \
            --profiles-dir "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Set up signing certificate
        script: |
          keychain add-certificates \
            --certificate "$HOME/Library/MobileDevice/Certificates/*.p12" \
            --certificate-password "$CERTIFICATE_P12_PASSWORD"
      - name: Verify certificate is in keychain
        script: |
          security find-identity -v -p codesigning
      - name: List downloaded provisioning profiles
        script: |
          echo "Contents of profiles directory:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "Directory does not exist or is empty"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --verbose
      - name: Archive the app
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=322DV2PB9V \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION=2.130298.0 \
            CURRENT_PROJECT_VERSION=17
      - name: Export ipa
        script: |
          PROFILE_PATH=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -n 1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No .mobileprovision file found in Provisioning Profiles directory"
            exit 1
          fi
          echo "Profile file: $PROFILE_PATH"
          echo "File details:"
          ls -la "$PROFILE_PATH"
          file "$PROFILE_PATH"
          echo "--- Extracting profile name ---"
          security cms -D -i "$PROFILE_PATH" -o /tmp/profile.plist
          echo "Decoded plist contents saved. First 500 chars:"
          head -c 500 /tmp/profile.plist
          echo ""
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: Could not extract profile name from decoded plist"
            exit 1
          fi
          echo "Using provisioning profile: $PROFILE_NAME"
          cat > "$CM_BUILD_DIR/export_options.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>322DV2PB9V</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Joba24 Android Workflow
    max_build_duration: 60
    environment:
      android_signing:
        - joba24_android_upload
      vars:
        ANDROID_VERSION_CODE: 17
        ANDROID_VERSION_NAME: "1.0.0"
        VITE_BASE44_APP_ID: "69e6bdb4986a04a256653a23"
        VITE_BASE44_APP_BASE_URL: "https://joba24.base44.app"
      node: latest
      java: 21
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Verify Base44 config was injected into build
        script: |
          if grep -r "69e6bdb4986a04a256653a23" dist/ > /dev/null 2>&1; then
            echo "App ID found in build output - good"
          else
            echo "ERROR: App ID not found in dist/ - VITE_BASE44_APP_ID may not have been injected correctly"
            exit 1
          fi
          if grep -r "joba24.base44.app" dist/ > /dev/null 2>&1; then
            echo "App base URL found in build output - good"
          else
            echo "ERROR: joba24.base44.app not found in dist/ - VITE_BASE44_APP_BASE_URL may not have been injected correctly"
            exit 1
          fi
      - name: Remove remote server URL for local Android build
        script: |
          python3 << 'PYEOF'
          import json

          with open("capacitor.config.json", "r") as f:
              config = json.load(f)

          if "server" in config:
              del config["server"]

          with open("capacitor.config.json", "w") as f:
              json.dump(config, f, indent=2)

          print("Updated capacitor.config.json for local Android build:")
          print(json.dumps(config, indent=2))
          PYEOF
      - name: Add Android platform
        script: |
          npx cap add android
      - name: Copy Firebase google-services.json
        script: |
          if [ -f "android-config/google-services.json" ]; then
            cp android-config/google-services.json android/app/google-services.json
            echo "google-services.json copied successfully"
          else
            echo "ERROR: android-config/google-services.json not found in repo"
            exit 1
          fi
      - name: Copy custom app icon and splash screen
        script: |
          RES_DIR="android/app/src/main/res"

          if [ ! -d "android-config/icons" ] || [ ! -f "android-config/splash.png" ]; then
            echo "ERROR: android-config/icons/ or android-config/splash.png not found in repo"
            exit 1
          fi

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "android-config/icons/mipmap-$density/ic_launcher.png" "$RES_DIR/mipmap-$density/ic_launcher.png"
            cp "android-config/icons/mipmap-$density/ic_launcher_round.png" "$RES_DIR/mipmap-$density/ic_launcher_round.png"
            cp "android-config/icons/mipmap-$density/ic_launcher_foreground.png" "$RES_DIR/mipmap-$density/ic_launcher_foreground.png"
          done
          echo "App icon replaced in all densities"

          cp "android-config/splash.png" "$RES_DIR/drawable/splash.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "android-config/splash.png" "$RES_DIR/drawable-land-$density/splash.png"
            cp "android-config/splash.png" "$RES_DIR/drawable-port-$density/splash.png"
          done
          echo "Splash screen replaced in all densities and orientations"
      - name: Patch AndroidManifest.xml with joba24:// intent-filter
        script: |
          python3 << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()

          intent_filter_block = '''
                      <intent-filter android:autoVerify="false">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="joba24" />
                      </intent-filter>
          '''

          count = content.count("</activity>")
          if count != 1:
              raise SystemExit(f"ERROR: expected exactly 1 </activity> tag, found {count} - manifest structure changed, review the patch script")

          content = content.replace("</activity>", intent_filter_block + "        </activity>", 1)

          # Add location permissions if not already present
          if 'ACCESS_FINE_LOCATION' not in content:
              location_perms = '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              content = content.replace('<application', location_perms + '<application', 1)
              print("Location permissions added to manifest")
          else:
              print("Location permissions already present")

          # Add POST_NOTIFICATIONS permission (required since Android 13 / API 33)
          # Without this, the system will NEVER show the notification permission popup,
          # regardless of what the JS code calls.
          if 'POST_NOTIFICATIONS' not in content:
              notif_perm = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              content = content.replace('<application', notif_perm + '<application', 1)
              print("POST_NOTIFICATIONS permission added to manifest")
          else:
              print("POST_NOTIFICATIONS permission already present")

          with open(manifest_path, "w") as f:
              f.write(content)

          print("Manifest patched successfully")
          PYEOF
      - name: Patch build.gradle with signing config, version, and Google Services plugin
        script: |
          python3 << 'PYEOF'
          import os

          # ── 1. Patch PROJECT-level build.gradle (android/build.gradle) ──
          # Add Google Services classpath for Firebase plugins
          proj_gradle = "android/build.gradle"
          with open(proj_gradle, "r") as f:
            proj_content = f.read()

          if "com.google.gms:google-services" not in proj_content:
            # Insert into buildscript.dependencies block
            if "dependencies {" in proj_content:
              proj_content = proj_content.replace(
                "dependencies {",
                "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                1
              )
              print("[gradle] Added Google Services classpath to project build.gradle")
            else:
              raise SystemExit("ERROR: No dependencies block in android/build.gradle")
          else:
            print("[gradle] Google Services classpath already present in project build.gradle")

          with open(proj_gradle, "w") as f:
            f.write(proj_content)

          # ── 2. Patch APP-level build.gradle (android/app/build.gradle) ──
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
            content = f.read()

          anchor = 'compileSdk = rootProject.ext.compileSdkVersion'
          if content.count(anchor) != 1:
            raise SystemExit(f"ERROR: expected exactly 1 occurrence of compileSdk anchor, found {content.count(anchor)}")

          signing_block = anchor + '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }'''
          content = content.replace(anchor, signing_block, 1)

          release_anchor = "release {\n            minifyEnabled false"
          if content.count(release_anchor) != 1:
            raise SystemExit(f"ERROR: expected exactly 1 occurrence of release buildType anchor, found {content.count(release_anchor)}")
          content = content.replace(
            release_anchor,
            "release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
            1
          )

          version_code = os.environ["ANDROID_VERSION_CODE"]
          version_name = os.environ["ANDROID_VERSION_NAME"]
          content = content.replace("versionCode 1", f"versionCode {version_code}", 1)
          content = content.replace('versionName "1.0"', f'versionName "{version_name}"', 1)

          # Add Google Services plugin at the END of app build.gradle (required for Firebase)
          if "com.google.gms.google-services" not in content:
            content = content.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
            print("[gradle] Added Google Services plugin to app build.gradle")
          else:
            print("[gradle] Google Services plugin already present in app build.gradle")

          with open(gradle_path, "w") as f:
            f.write(content)

          print("build.gradle patched successfully")
          print(content)
          PYEOF
      - name: Sync Capacitor Android project
        script: |
          npx cap sync android
      - name: Verify location permissions survived cap sync
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== AndroidManifest.xml contents ==="
          cat "$MANIFEST"
          echo ""
          echo "=== Checking for location permissions ==="
          if grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            echo "✓ ACCESS_FINE_LOCATION found in manifest"
          else
            echo "✗ ERROR: ACCESS_FINE_LOCATION NOT in manifest after cap sync — patch was lost!"
            exit 1
          fi
          if grep -q "ACCESS_COARSE_LOCATION" "$MANIFEST"; then
            echo "✓ ACCESS_COARSE_LOCATION found in manifest"
          else
            echo "✗ ERROR: ACCESS_COARSE_LOCATION NOT in manifest after cap sync — patch was lost!"
            exit 1
          fi
          if grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            echo "✓ POST_NOTIFICATIONS found in manifest"
          else
            echo "✗ ERROR: POST_NOTIFICATIONS NOT in manifest — notifications popup will NEVER appear on Android 13+!"
            exit 1
          fi
      - name: Verify capacitor.config.json has no server.url
        script: |
          if python3 -c "import json; c=json.load(open('capacitor.config.json')); exit(0 if 'server' not in c else 1)"; then
            echo "✓ server.url removed — app will use LOCAL bundle (Capacitor bridge available)"
          else
            echo "✗ ERROR: server.url still present — app would load remote content, Capacitor bridge would NOT be injected, native plugins would fail!"
            cat capacitor.config.json
            exit 1
          fi
      - name: Verify @capacitor/geolocation plugin is in Gradle
        script: |
          if grep -q "geolocation" android/app/capacitor.build.gradle 2>/dev/null || \
             grep -q "geolocation" android/app/src/main/java/AndroidManifest.xml 2>/dev/null || \
             find android -name "*.java" -path "*geolocation*" 2>/dev/null | head -1 | grep -q .; then
            echo "✓ @capacitor/geolocation plugin native code found"
          else
            echo "⚠ WARNING: @capacitor/geolocation not found in native project — checking dependencies..."
            grep -r "geolocation" android/app/build.gradle android/app/capacitor.build.gradle 2>/dev/null || echo "Plugin not in gradle files!"
          fi
      - name: Verify Google Services plugin and Firebase messaging in Gradle
        script: |
          echo "=== Checking project-level build.gradle for Google Services classpath ==="
          if grep -q "com.google.gms:google-services" android/build.gradle; then
            echo "✓ Google Services classpath found in project build.gradle"
          else
            echo "✗ CRITICAL: Google Services classpath missing from android/build.gradle — Firebase plugins will NOT work!"
            cat android/build.gradle
            exit 1
          fi
          echo ""
          echo "=== Checking app-level build.gradle for Google Services plugin ==="
          if grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "✓ Google Services plugin found in app build.gradle"
          else
            echo "✗ CRITICAL: Google Services plugin missing from android/app/build.gradle — Firebase will NOT initialize!"
            cat android/app/build.gradle
            exit 1
          fi
          echo ""
          echo "=== Checking Firebase messaging plugin sync ==="
          if grep -q "firebase" android/app/capacitor.build.gradle 2>/dev/null || \
             grep -q "firebase-messaging" android/app/build.gradle 2>/dev/null; then
            echo "✓ Firebase messaging plugin found in gradle"
          else
            echo "⚠ WARNING: Firebase messaging not found in capacitor.build.gradle — checking..."
            cat android/app/capacitor.build.gradle 2>/dev/null || echo "capacitor.build.gradle not found"
          fi
      - name: Build signed AAB
        script: |
          echo "Available Java versions:"
          /usr/libexec/java_home -V 2>&1 || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          echo "Using JAVA_HOME: $JAVA_HOME"
          java -version
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease -Dorg.gradle.java.home="$JAVA_HOME"
      - name: Verify final merged manifest has location permissions
        script: |
          echo "=== Checking MERGED manifest (what actually goes into the APK/AAB) ==="
          MERGED="android/app/build/intermediates/merged_manifests/release/AndroidManifest.xml"
          if [ ! -f "$MERGED" ]; then
            MERGED="android/app/build/intermediates/merged_manifest/release/AndroidManifest.xml"
          fi
          if [ ! -f "$MERGED" ]; then
            echo "WARNING: merged manifest not found at expected path — searching..."
            MERGED=$(find android/app/build -name "AndroidManifest.xml" -path "*merged*" 2>/dev/null | head -1)
          fi
          if [ -z "$MERGED" ] || [ ! -f "$MERGED" ]; then
            echo "✗ ERROR: Could not find merged manifest in build output!"
            find android/app/build -name "AndroidManifest.xml" 2>/dev/null
            exit 1
          fi
          echo "Using merged manifest: $MERGED"
          echo ""
          echo "=== Location permissions in final merged manifest ==="
          if grep -q "ACCESS_FINE_LOCATION" "$MERGED"; then
            echo "✓ ACCESS_FINE_LOCATION — present in final APK manifest"
          else
            echo "✗ CRITICAL: ACCESS_FINE_LOCATION missing from final APK manifest!"
            echo "=== Full merged manifest ==="
            cat "$MERGED"
            exit 1
          fi
          if grep -q "ACCESS_COARSE_LOCATION" "$MERGED"; then
            echo "✓ ACCESS_COARSE_LOCATION — present in final APK manifest"
          else
            echo "✗ CRITICAL: ACCESS_COARSE_LOCATION missing from final APK manifest!"
            exit 1
          fi
          if grep -q "POST_NOTIFICATIONS" "$MERGED"; then
            echo "✓ POST_NOTIFICATIONS — present in final APK manifest"
          else
            echo "✗ CRITICAL: POST_NOTIFICATIONS missing from final APK manifest — notifications will NOT work on Android 13+!"
            exit 1
          fi
          echo ""
          echo "=== Geolocation plugin in final manifest ==="
          if grep -q "geolocation\|Geolocation" "$MERGED"; then
            echo "✓ Geolocation references found"
          else
            echo "ℹ (no geolocation references in manifest — plugin may use different registration)"
          fi
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
