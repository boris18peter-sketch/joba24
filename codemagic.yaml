workflows:
  ios-workflow:
    name: Joba24 iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Joba24
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.base69e6bdb4986a04a256653a23.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        CERTIFICATE_P12_PASSWORD: "Joba24SigningPass1"
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor iOS project
        script: |
          ./node_modules/.bin/cap sync ios
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --p12-password "$CERTIFICATE_P12_PASSWORD" \
            --certificates-dir "$HOME/Library/MobileDevice/Certificates" \
            --profiles-dir "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Set up signing certificate
        script: |
          keychain add-certificates \
            --certificate "$HOME/Library/MobileDevice/Certificates/*.p12" \
            --certificate-password "$CERTIFICATE_P12_PASSWORD"
      - name: Verify certificate is in keychain
        script: |
          security find-identity -v -p codesigning
      - name: List downloaded provisioning profiles
        script: |
          echo "Contents of profiles directory:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "Directory does not exist or is empty"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Archive the app
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=322DV2PB9V \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution"
      - name: Export ipa
        script: |
          PROFILE_PATH=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -n 1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No .mobileprovision file found in Provisioning Profiles directory"
            exit 1
          fi
          echo "Profile file: $PROFILE_PATH"
          echo "File details:"
          ls -la "$PROFILE_PATH"
          file "$PROFILE_PATH"
          echo "--- Trying security cms extraction ---"
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/tmp/cms_error.log | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin 2>/dev/null)
          if [ -z "$PROFILE_NAME" ]; then
            echo "security cms method failed, error was:"
            cat /tmp/cms_error.log
            echo "--- Trying grep fallback extraction ---"
            PROFILE_NAME=$(grep -a -A1 '<key>Name</key>' "$PROFILE_PATH" | tail -1 | sed -E 's/.*<string>(.*)<\/string>.*/\1/')
          fi
          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: Could not extract profile name from $PROFILE_PATH using either method"
            exit 1
          fi
          echo "Using provisioning profile: $PROFILE_NAME"
          cat > "$CM_BUILD_DIR/export_options.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>322DV2PB9V</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
