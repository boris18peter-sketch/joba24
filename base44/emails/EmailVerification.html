<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#ffffff;border:1px solid #e5e7eb;border-radius:22px;overflow:hidden;">

        <tr>
          <td style="background:#1e6fd2;padding:20px 28px;font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:900;color:#ffffff;text-align:center;letter-spacing:-0.4px;">
            Joba24
          </td>
        </tr>

        <tr>
          <td style="background:#ffffff;padding:36px 28px;font-family:Inter,Arial,sans-serif;direction:rtl;text-align:right;">
            <div style="font-size:24px;font-weight:900;color:#0d1e40;line-height:1.3;margin:0 0 10px;">קוד האימות שלך</div>
            <div style="font-size:15px;color:#4b6083;line-height:1.7;margin:0 0 24px;">שלום {{first_name}}, הנה קוד האימות שלך לחשבון {{app_name}}:</div>
            <div style="font-family:Inter,Arial,sans-serif;font-size:36px;font-weight:900;letter-spacing:10px;color:#0d1e40;background:#f2f5fb;border:1px solid #e5e7eb;border-radius:22px;padding:22px 12px;text-align:center;">{{otp_code}}</div>
            <div style="font-size:14px;color:#4b6083;line-height:1.7;margin:24px 0 0;">הזן/י את הקוד במסך ההרשמה כדי להשלים את האימות.</div>
            <div style="font-size:13px;color:#4b6083;line-height:1.7;margin:12px 0 0;">אם לא ביקשת קוד, אפשר להתעלם מהודעה זו.</div>
          </td>
        </tr>

        <tr>
          <td style="background:#f2f5fb;padding:18px 28px;font-family:Inter,Arial,sans-serif;font-size:11px;color:#4b6083;text-align:center;">כל הזכויות שמורות ל-Joba24</td>
        </tr>

      </table>

    </td>
  </tr>
</table>
