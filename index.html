    <!-- Google tag (gtag.js) — Google Ads. ONE installation only; never add a
         second copy of this snippet. The TaskPublished conversion itself is
         reported from src/lib/analytics/providers/googleads.js, and only after
         the server has confirmed a persisted task.
         Consent Mode v2: advertising and analytics storage are denied for every
         visitor until they make an explicit choice — consent is never assumed
         on their behalf, in any region. The choice is handled by
         src/lib/consent.js and src/components/ConsentBanner.jsx.
         Enhanced Conversions are NOT enabled and no personal data is sent. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18513050750"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      /* ── Consent Mode v2 ─────────────────────────────────────────────────
         Conservative, uniform default: all four advertising and analytics
         signals are DENIED, everywhere, until the visitor chooses.

         The EEA, the UK and Switzerland require prior opt-in consent for
         advertising storage. Rather than assume that every other jurisdiction
         permits a granted default, this denies for everyone and relies on the
         banner to collect a real choice — the safe common denominator across
         the regions this site is served to.

         Nothing is measured until the visitor accepts below; accepting grants
         all four signals and restores full Google Ads conversion measurement. */
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });

      /* A choice made on a previous visit overrides the default above, in every
         region — including an explicit decline anywhere in the world.
         Read synchronously, BEFORE the tag is configured, so no hit can be sent
         ahead of the visitor's decision. Key must match CONSENT_STORAGE_KEY in
         src/lib/consent.js. */
      try {
        var jobaConsent = localStorage.getItem('joba24_ads_consent');
        if (jobaConsent === 'granted' || jobaConsent === 'denied') {
          gtag('consent', 'update', {
            ad_storage: jobaConsent,
            ad_user_data: jobaConsent,
            ad_personalization: jobaConsent,
            analytics_storage: jobaConsent
          });
        }
      } catch (e) { /* storage unavailable — the defaults above still apply */ }

      gtag('js', new Date());
      gtag('config', 'AW-18513050750');
    </script>
    <title>Joba24 — משימות מהירות</title>
    <script>
      // Capture OAuth callback token+sid from the URL BEFORE the app module
      // loads and strips the token. Runs in the external in-app browser
      // (SFSafariViewController / Chrome Custom Tab) after Google/Apple/Facebook
      // redirect back to joba24.com. NativeOAuthBounce relays it to the app.
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          var t = p.get('access_token');
          var s = p.get('sid');
          // Also check the hash fragment (some OAuth flows use #access_token=...)
          if (!t && window.location.hash) {
            var h = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            t = h.get('access_token') || t;
            if (!s) s = h.get('sid') || s;
          }
          if (t) {
            sessionStorage.setItem('joba24_oauth_token', t);
            if (s) sessionStorage.setItem('joba24_oauth_sid', s);
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) && !/Windows Phone/.test(ua);
            // Store the handshake (fallback for the native poll) — fire-and-forget.
            // Relative path resolves to this page's own origin (base44.app on the
            // /auth-callback page, joba24.com elsewhere), same Base44 backend the
            // native poll reads from. The sid is preserved via the base44.app
            // from_url (set in LoginPromptModal), so the poll matches by sid.
            try {
              fetch('/api/functions/nativeAuthHandshake', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'store', sid: s || null, token: t })
              }).catch(function () {});
            } catch (e) {}
            // Normalize to the canonical base44.app domain. The native app's
            // LoginPromptModal builds from_url; an older app build still points it
            // at joba24.com/auth-callback, and the Custom Tab can serve a STALE
            // cached build for that origin (→ old "press ✕" screen, no button, no
            // handshake store → login loop). base44.app always serves the current
            // build, so redirect any /auth-callback landing on a different origin
            // to base44.app (token + sid preserved, cache-buster appended). On
            // base44.app itself this is a no-op (no redirect, no loop).
            try {
              if (window.location.pathname === '/auth-callback' &&
                  window.location.origin !== 'https://joba24.base44.app') {
                var rp = new URLSearchParams();
                rp.set('access_token', t);
                if (s) rp.set('sid', s);
                rp.set('cb', String(Date.now()));
                window.location.replace('https://joba24.base44.app/auth-callback?' + rp.toString());
                return;
              }
            } catch (e) {}
            // Instantly return to the native app via the joba24:// scheme —
            // iOS ONLY, and ONLY on the /auth-callback route (the native-flow
            // signal). On the regular web flow the OAuth provider returns the
            // user to joba24.com/?access_token=… (from_url = the page they were
            // on) — firing joba24:// there either does nothing (app not
            // installed) or hijacks the page, leaving mobile Safari on a blank
            // white screen. The Base44 SDK picks up the web-flow token from the
            // URL by itself; the scheme is exclusively for the native callback.
            if (isIOS && window.location.pathname === '/auth-callback') {
              try { window.location.replace('joba24://auth-callback?access_token=' + encodeURIComponent(t)); } catch (e) {}
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #ffffff; }
      body { padding-top: max(0px, env(safe-area-inset-top)); padding-bottom: 0; padding-left: max(0px, env(safe-area-inset-left)); padding-right: max(0px, env(safe-area-inset-right)); }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
      /* Inline skeleton — shown instantly until React mounts */
      .preload-header { width:100%; height:56px; background:#ffffff; display:flex; align-items:center; padding:0 16px; box-sizing:border-box; flex-shrink:0; }
      .preload-logo { width:36px; height:36px; border-radius:10px; background:#ffffff; }
      .preload-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
      .preload-spinner { width:36px; height:36px; border-radius:50%; border:3px solid #e8edf5; border-top-color:#1a6fd4; animation:preload-spin .8s linear infinite; }
      .preload-text { font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:14px; color:#94a3b8; font-weight:500; }
      @keyframes preload-spin { to{transform:rotate(360deg)} }
    </style>
    <!-- Tranzila Apple Pay SDK — direct domain integration.
         Runs Apple Pay from our top-level origin (required by Apple),
         so the iframe's Apple Pay button can delegate the session to us.
         jQuery is isolated via noConflict(true) → no pollution to the React app. -->

    <script>document.write('<script src="https://direct.tranzila.com/js/tranzilanapple_v3.js?v=' + Date.now() + '"><\/script>');</script>

  </head>
  <body>
    <div id="root">
      <div class="preload-header"><div class="preload-logo"></div></div>
      <div class="preload-body">
        <div class="preload-spinner"></div>
        <div class="preload-text">טוען...</div>
      </div>
    </div>
    <!-- Firebase is loaded on-demand via lib/fcm.js — no blocking CDN scripts on initial load -->
    <script>
      console.log('[Joba24] HTML: page loaded, React not yet mounted');
      window.__joba24Startup = { htmlReady: Date.now() };
      // Ensure body isn't white even if CSS fails entirely
      document.body.style.backgroundColor = '#ffffff';
    </script>
    <!-- Self-heal: Android's WebView caches index.html aggressively and keeps
         serving a STALE version after a new deploy — so the app runs old code
         (the root cause of "my fix isn't showing on Android" + the OAuth loop).
         This fetches the LIVE index.html with a cache-buster, compares the
         main-module src (Vite hashes it per build → changes every publish),
         and force-reloads fresh if they differ. iOS doesn't cache this way. -->
    <script>
      (function () {
        try {
          var cur = document.querySelector('script[type="module"][src]');
          var curSrc = cur ? cur.getAttribute('src') : '';
          if (curSrc && sessionStorage.getItem('joba24_selfheal') === '1') { sessionStorage.removeItem('joba24_selfheal'); return; }
          fetch('/index.html?cb=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              // Vite emits the built tag as
              // <script type="module" crossorigin src="/assets/index-HASH.js">,
              // so src is NOT adjacent to type="module" — the old pattern never
              // matched in production and this whole guard was dead code. Allow
              // any attributes between them.
              var m = html.match(/<script\b[^>]*\btype="module"[^>]*\bsrc="([^"]+)"/);
              var freshSrc = m ? m[1] : '';
              if (freshSrc && curSrc && freshSrc !== curSrc) {
                sessionStorage.setItem('joba24_selfheal', '1');
                // Preserve the FULL query string (access_token, sid, ref, …) so the
                // /auth-callback OAuth callback keeps its token after the fresh
                // reload (index.html re-captures it on the next load). Previously
                // the self-heal SKIPPED on access_token — which left a stale
                // /auth-callback build stuck forever in the Chrome Custom Tab.
                var sep = window.location.search ? '&' : '?';
                window.location.replace(window.location.pathname + window.location.search + sep + 'cb=' + Date.now() + window.location.hash);
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <!-- ENTRY WATCHDOG — the one failure nothing inside the app can catch.
         "TypeError: Importing a module script failed." (WebKit) means the
         browser could not fetch/parse the app's entry chunk, which happens when
         a cached index.html still points at a hashed chunk that no longer
         exists after a deploy. main.jsx already self-heals this — but only once
         IT has loaded: if the entry chunk is the thing that failed, no handler
         inside the app ever runs and the user is left on the skeleton forever.
         This inline guard runs before the module script and covers both cases:
         the script failing to load, and it loading without React ever mounting.
         Throttled through the same key main.jsx uses, so the two can never
         fight each other into a reload loop. -->
    <script>
      (function () {
        var KEY = 'joba24_main_reload_ts';
        function heal() {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last <= 15000) return; // already healed recently
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          var sep = window.location.search ? '&' : '?';
          window.location.replace(
            window.location.pathname + window.location.search +
            sep + 'cb=' + Date.now() + window.location.hash
          );
        }
        // 1. The entry module fails to fetch or parse. That fires a plain error
        //    event on the <script> element itself — there is no message to read.
        window.addEventListener('error', function (ev) {
          var el = ev.target;
          if (el && el !== window && el.tagName === 'SCRIPT' && el.type === 'module') heal();
        }, true);
        // 2. The entry loaded but React never replaced the skeleton — a chunk it
        //    needed failed on the way. Only after a generous wait, so a slow
        //    connection is never mistaken for a failure.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.querySelector('.preload-spinner')) heal();
          }, 8000);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
