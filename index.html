<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="true" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Joba24" />
    <meta name="mobile-web-app-capable" content="true" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="https://media.base44.com/images/public/69e6bdb4986a04a256653a23/d5824a161_IMG_0357.jpg" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/69e6bdb4986a04a256653a23/d5824a161_IMG_0357.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Joba24 — משימות מהירות</title>
    <script>
      // Capture OAuth callback token+sid from the URL BEFORE the app module
      // loads and strips the token. Runs in the external in-app browser
      // (SFSafariViewController / Chrome Custom Tab) after Google/Apple/Facebook
      // redirect back to joba24.com. NativeOAuthBounce relays it to the app.
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          var t = p.get('access_token');
          var s = p.get('sid');
          // Also check the hash fragment (some OAuth flows use #access_token=...)
          if (!t && window.location.hash) {
            var h = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            t = h.get('access_token') || t;
            if (!s) s = h.get('sid') || s;
          }
          if (t) {
            sessionStorage.setItem('joba24_oauth_token', t);
            if (s) sessionStorage.setItem('joba24_oauth_sid', s);
            // Store the handshake (fallback for the native poll) — fire-and-forget.
            try {
              fetch('/api/functions/nativeAuthHandshake', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'store', sid: s || null, token: t })
              }).catch(function () {});
            } catch (e) {}
            // Instantly return to the native app via the joba24:// scheme.
            // Firing it here (in <head>, before React loads) makes the return
            // near-instant instead of waiting for the SPA to mount + a network
            // round-trip. SFSafariViewController opens the app from this navigation.
            try { window.location.replace('joba24://auth-callback?access_token=' + encodeURIComponent(t)); } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #ffffff; }
      body { padding-top: max(0px, env(safe-area-inset-top)); padding-bottom: 0; padding-left: max(0px, env(safe-area-inset-left)); padding-right: max(0px, env(safe-area-inset-right)); }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
      /* Inline skeleton — shown instantly until React mounts */
      .preload-header { width:100%; height:56px; background:#ffffff; display:flex; align-items:center; padding:0 16px; box-sizing:border-box; flex-shrink:0; }
      .preload-logo { width:36px; height:36px; border-radius:10px; background:#ffffff; }
      .preload-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
      .preload-spinner { width:36px; height:36px; border-radius:50%; border:3px solid #e8edf5; border-top-color:#1a6fd4; animation:preload-spin .8s linear infinite; }
      .preload-text { font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:14px; color:#94a3b8; font-weight:500; }
      @keyframes preload-spin { to{transform:rotate(360deg)} }
    </style>
    <!-- Tranzila Apple Pay SDK — direct domain integration.
         Runs Apple Pay from our top-level origin (required by Apple),
         so the iframe's Apple Pay button can delegate the session to us.
         jQuery is isolated via noConflict(true) → no pollution to the React app. -->
    <script type="text/javascript" src="https://direct.tranzila.com/Tranzila_files/jquery.js"></script>
    <script>document.write('<script src="https://direct.tranzila.com/js/tranzilanapple_v3.js?v=' + Date.now() + '"><\/script>');</script>
    <script>var $n = jQuery.noConflict(true);</script>
  </head>
  <body>
    <div id="root">
      <div class="preload-header"><div class="preload-logo"></div></div>
      <div class="preload-body">
        <div class="preload-spinner"></div>
        <div class="preload-text">טוען...</div>
      </div>
    </div>
    <!-- Firebase is loaded on-demand via lib/fcm.js — no blocking CDN scripts on initial load -->
    <script>
      console.log('[Joba24] HTML: page loaded, React not yet mounted');
      window.__joba24Startup = { htmlReady: Date.now() };
      // Ensure body isn't white even if CSS fails entirely
      document.body.style.backgroundColor = '#ffffff';
    </script>
    <!-- Self-heal: Android's WebView caches index.html aggressively and keeps
         serving a STALE version after a new deploy — so the app runs old code
         (the root cause of "my fix isn't showing on Android" + the OAuth loop).
         This fetches the LIVE index.html with a cache-buster, compares the
         main-module src (Vite hashes it per build → changes every publish),
         and force-reloads fresh if they differ. iOS doesn't cache this way. -->
    <script>
      (function () {
        try {
          // Mid-OAuth: the URL carries an access_token — never interrupt with a reload.
          if (new URLSearchParams(window.location.search).get('access_token')) return;
          var cur = document.querySelector('script[type="module"][src]');
          var curSrc = cur ? cur.getAttribute('src') : '';
          if (curSrc && sessionStorage.getItem('joba24_selfheal') === '1') { sessionStorage.removeItem('joba24_selfheal'); return; }
          fetch('/index.html?cb=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              var m = html.match(/<script\s+type="module"\s+src="([^"]+)"/);
              var freshSrc = m ? m[1] : '';
              if (freshSrc && curSrc && freshSrc !== curSrc) {
                sessionStorage.setItem('joba24_selfheal', '1');
                // Preserve the pathname so /auth-callback etc. keep working.
                window.location.replace(window.location.pathname + '?cb=' + Date.now() + window.location.hash);
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
